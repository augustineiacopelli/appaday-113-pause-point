<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pause Point</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf6ef;
    --accent: #b5482c;
    --muted: #7a7469;
    --line: #e4ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    padding: 16px;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0 0 4px;
  }
  .streak {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .streak strong {
    color: var(--accent);
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    min-height: 40px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  button {
    min-height: 40px;
    padding: 0 14px;
    border-radius: 6px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-size: 0.9rem;
    cursor: pointer;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
    word-break: break-word;
    gap: 8px;
  }
  li button {
    background: transparent;
    color: var(--muted);
    border: none;
    min-height: 32px;
    min-width: 44px;
    font-size: 0.85rem;
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 12px 0;
  }
  .backlink {
    margin-top: 12px;
    font-size: 0.75rem;
    text-align: center;
  }
  .backlink a {
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>Pause Point</h1>
  <div class="streak">Held streak: <strong id="streakCurrent">0</strong> &middot; best <span id="streakBest">0</span></div>

  <form id="addForm">
    <input type="text" id="domainInput" placeholder="example.com" />
    <button type="submit">Add</button>
  </form>

  <ul id="blocklistItems"></ul>
  <div class="backlink"><a href="https://augustineiacopelli.github.io/appaday/" target="_blank" rel="noopener">AppADay</a></div>

  <script src="popup.js"></script>
</body>
</html>
